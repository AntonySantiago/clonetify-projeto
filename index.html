<!DOCTYPE html>
<html lang="pt-BR">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clonetify</title>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header id="header">

        <h1 id="clonetifytitulo">Clonetify</h1>

        <button id="home">Home</button>

        <input
            type="text"
            id="barradeprocura"
            placeholder="Pesquisar..."
        >

        <button id="pesquisabotao">Pesquisar</button>

        <button id="sair">Sair</button>

    </header>


    <!-- TELA DE LOGIN -->
    <div id="caixaprincipal">

        <div id="caixa">

            <h1>Clonetify</h1>

            <input
                type="text"
                id="usuarioinput"
                placeholder="Usuário"
            >

            <input
                type="password"
                id="senhainput"
                placeholder="Senha"
            >

            <button id="logar">Entrar</button>

            <button id="criarconta">
                Criar conta
            </button>


            <!-- CRIAR CONTA -->

            <div id="criaroconta1">

                <h2>Criar conta</h2>

                <input
                    type="text"
                    id="criarusuario"
                    placeholder="Novo usuário"
                >

                <input
                    type="password"
                    id="criarsenha"
                    placeholder="Nova senha"
                >

                <button id="criarcontabutao">
                    Criar
                </button>

            </div>

        </div>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>


        <!-- PAINEL DO ADMIN -->

        <section id="paineladmin">

            <h1>Painel do Administrador</h1>

            <h2>Adicionar música</h2>

            <label>Imagem do artista</label>
            <input
                type="file"
                id="artistaimg"
                accept="image/*"
            >

            <label>Nome do artista</label>
            <input
                type="text"
                id="nomeartista"
                placeholder="Nome do artista"
            >

            <label>Capa da música</label>
            <input
                type="file"
                id="musicaimg"
                accept="image/*"
            >

            <label>Arquivo da música</label>
            <input
                type="file"
                id="musicamp3"
                accept="audio/*"
            >

            <label>Nome da música</label>
            <input
                type="text"
                id="nomedamusica"
                placeholder="Nome da música"
            >

            <button id="adicionarmusica">
                Adicionar música
            </button>

            <hr>

            <h2>Músicas cadastradas</h2>

            <div id="listamusicasadmin"></div>

        </section>



        <!-- BIBLIOTECA DO USUÁRIO -->

        <section id="biblioteca">

            <h1>Artistas</h1>

            <div id="listaartistas"></div>


            <div id="musicasescolhidas">

                <h2 id="nomedoartista"></h2>

                <div id="listamusicas"></div>

            </div>

        </section>

    </main>



    <!-- PLAYER -->

    <div id="player">

        <img
            id="playercapa"
            src=""
            alt="Capa"
        >

        <div id="playerinformacoes">

            <h2 id="playernome">
                Nenhuma música selecionada
            </h2>

            <p id="playerartista"></p>

            <audio
                id="playeraudio"
                controls
            ></audio>

        </div>

    </div>



    <footer>

        <p>Clonetify</p>

    </footer>


    <script type="module" src="mainscript.js"></script>

</body>

</html>
